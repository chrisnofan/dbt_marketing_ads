version: 2

models:
  - name: stg_snapchat_ad_group_names #  Must match the filename of a model -- including case sensitivity.
    description: "This model is a staging model for the snapchat_ad_group_names table."

    columns:
      - name: _surrogate_key
        description: "The surrogate key for the snapchat_ad_group_names table."
        data_tests:
          - unique
          - not_null

      - name: ad_group_id
        description: "The unique identifier for the Snapchat ad group."
        
      - name: campaign_id
        description: "The unique identifier for the Snapchat campaign."
        data_tests:
          - unique
          - not_null

      - name: ad_group_name
        description: "The name of the Snapchat ad group."

      - name: ad_group_updated_at
        description: "The timestamp when the Snapchat ad group was last updated."  
  

   