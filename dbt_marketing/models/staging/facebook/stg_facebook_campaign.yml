version: 2

models:
  - name: stg_facebook_campaign  # Must match the filename of a model -- including case sensitivity.
    description: "This model is a staging model for the facebook_campaign table."

    columns:
      - name: campaign_id
        description: "The unique identifier for the Facebook campaign."
        data_tests:
          - unique
          - not_null

      - name: campaign_name
        description: "The name of the Facebook campaign."
      
      - name: campaign_updated_at
        description: "The timestamp when the Facebook campaign was last updated."